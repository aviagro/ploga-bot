services:
  - type: web
    name: ploga-bot
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: TELEGRAM_TOKEN
        sync: false
      - key: SHEET_CSV_URL
        sync: false
